server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compress text assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # hashed build assets: cache forever, the filename changes on rebuild
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # images and fonts: cache for a month, no revalidation against the origin
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # html: always revalidate so a new deploy shows up immediately
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
}
